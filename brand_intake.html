<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AE9 Labs // Sovereign Merch Fulfillment Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #08090d;
            --bg-secondary: #0b0c11;
            --bg-card: #121420;
            --accent-neon: #ff007f;
            --accent-cyber: #45f3ff;
            --text-main: #ffffff;
            --text-muted: #a9b7c6;
            --border-glow: rgba(69, 243, 255, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding: 60px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .tag {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-cyber);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            display: block;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 14px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-cyber);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .file-upload {
            border: 2px dashed var(--border-glow);
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            background: rgba(69, 243, 255, 0.02);
        }

        .file-upload input {
            display: none;
        }

        .file-upload label {
            cursor: pointer;
            color: var(--accent-cyber);
            text-transform: none;
            letter-spacing: 0;
            font-size: 14px;
            margin: 0;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-neon) 0%, #e60072 100%);
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.5);
        }

        .section-header {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: var(--accent-cyber);
            margin: 30px 0 16px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(69, 243, 255, 0.2);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <span class="tag">// Sovereign Physical Fulfillment</span>
    <h1>Custom Merch Order & Intake Matrix</h1>
    <p class="subtitle">Select your primary choices and enter exact team breakdowns below.</p>

    <form action="https://hook.us2.make.com/3r0evdq1t6mqkjmu7kjplhq3o987g7qb" method="POST" enctype="multipart/form-data">
        
        <input type="hidden" name="subject" value="New Custom Merch Order Submission - AE9 Labs">

        <!-- Customer Identity -->
        <div class="form-group">
            <label>Payhip Order ID / Company Name</label>
            <input type="text" name="customer_name" placeholder="Acme Corp (#PAYHIP-1234)" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="john@yourdomain.com" required>
        </div>

        <!-- Section 01: Apparel Sizing & Colors -->
        <div class="section-header">01. Primary Apparel Options</div>
        
        <div class="form-row">
            <div class="form-group">
                <label>Apparel Size</label>
                <select name="apparel_size">
                    <option value="" disabled selected>Select primary size...</option>
                    <option value="S">Small (S)</option>
                    <option value="M">Medium (M)</option>
                    <option value="L">Large (L)</option>
                    <option value="XL">Extra Large (XL)</option>
                    <option value="2XL">2XL</option>
                    <option value="3XL">3XL</option>
                    <option value="4XL">4XL (Tee Only)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Hoodie Color</label>
                <select name="hoodie_color">
                    <option value="N/A" selected>N/A - Not Ordering Hoodie</option>
                    <option value="Pepper">Pepper</option>
                    <option value="Peachy">Peachy</option>
                    <option value="Neon Violet">Neon Violet</option>
                    <option value="Grey">Grey</option>
                    <option value="White">White</option>
                    <option value="Black">Black</option>
                    <option value="Hydrangea">Hydrangea</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>T-Shirt Color</label>
            <select name="tshirt_color">
                <option value="N/A" selected>N/A - Not Ordering T-Shirt</option>
                <option value="Graphite">Graphite</option>
                <option value="Sage">Sage</option>
                <option value="Violet">Violet</option>
                <option value="Blossom">Blossom</option>
                <option value="Light Green">Light Green</option>
                <option value="White">White</option>
                <option value="Black">Black</option>
                <option value="Midnight">Midnight</option>
                <option value="Crunchberry">Crunchberry</option>
                <option value="Khaki">Khaki</option>
                <option value="Denim">Denim</option>
                <option value="Grey">Grey</option>
                <option value="Washed Denim">Washed Denim</option>
            </select>
        </div>

        <!-- Detailed Apparel Order Breakdown -->
        <div class="form-group">
            <label>T-Shirt Custom Order Breakdown (Multiple Sizes/Colors)</label>
            <textarea name="tshirt_order_breakdown" rows="2" placeholder="e.g., 5 x Large (Grey), 12 x Medium (Black), 80 x Large (Green)"></textarea>
        </div>

        <div class="form-group">
            <label>Hoodie Custom Order Breakdown (Multiple Sizes/Colors)</label>
            <textarea name="hoodie_order_breakdown" rows="2" placeholder="e.g., 3 x XL (Pepper), 10 x Medium (Neon Violet)"></textarea>
        </div>

        <!-- Section 02: Hardware & Custom Gear -->
        <div class="section-header">02. Hardware & Custom Gear</div>

        <div class="form-row">
            <div class="form-group">
                <label>Phone Model</label>
                <select name="phone_model">
                    <option value="N/A" selected>N/A - Not Ordering Phone Case</option>
                    <optgroup label="Apple iPhone">
                        <option value="iPhone 15 Pro">iPhone 15 Pro</option>
                        <option value="iPhone 15 Pro Max">iPhone 15 Pro Max</option>
                        <option value="iPhone 14">iPhone 14</option>
                        <option value="iPhone 13">iPhone 13</option>
                    </optgroup>
                    <optgroup label="Samsung Galaxy">
                        <option value="Samsung Galaxy S25">Samsung Galaxy S25</option>
                        <option value="Samsung Galaxy S25 Ultra">Samsung Galaxy S25 Ultra</option>
                    </optgroup>
                </select>
            </div>
            <div class="form-group">
                <label>Surface Finish</label>
                <select name="surface_finish">
                    <option value="N/A" selected>N/A</option>
                    <option value="Glossy">Glossy</option>
                    <option value="Matte">Matte</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Phone Case Order Breakdown (Models & Quantities)</label>
            <textarea name="phone_case_breakdown" rows="2" placeholder="e.g., 4 x iPhone 15 Pro, 2 x Samsung S25 Ultra (Matte)"></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Laptop Case Size</label>
                <select name="laptop_case_size">
                    <option value="N/A" selected>N/A - Not Ordering</option>
                    <option value="13 Inch">13" Sleeve</option>
                    <option value="15 Inch">15" Sleeve</option>
                </select>
            </div>
            <div class="form-group">
                <label>Sticker Quantity</label>
                <input type="text" name="sticker_quantity" placeholder="e.g., 1 Pack, 5 Pack, 50 Individual">
            </div>
        </div>

        <div class="form-group">
            <label>Hardware / Accessories Breakdown</label>
            <textarea name="hardware_breakdown" rows="2" placeholder="e.g., 5 x 13-inch sleeves, 2 x 15-inch sleeves"></textarea>
        </div>

        <!-- Section 03: Brand Assets -->
        <div class="section-header">03. Brand Assets</div>

        <div class="form-group">
            <label>Upload High-Res Logo (PNG or SVG with Transparent BG)</label>
            <div class="file-upload">
                <input type="file" id="logo-file" name="attachment" accept="image/png, image/svg+xml" required>
                <label for="logo-file">📁 Drag & drop or click to upload logo file</label>
            </div>
        </div>

        <!-- Section 04: Shipping Address -->
        <div class="section-header">04. Shipping Destination</div>

        <div class="form-group">
            <label>Shipping Street Address</label>
            <input type="text" name="shipping_address" placeholder="123 Main St, Suite 100" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>City, State, Zip Code</label>
                <input type="text" name="city_state_zip" placeholder="Phoenix, AZ 85001" required>
            </div>
            <div class="form-group">
                <label>Country</label>
                <input type="text" name="country" value="United States" required>
            </div>
        </div>

        <button type="submit" class="submit-btn">⚡ Launch Production Pipeline</button>
    </form>
</div>

</body>
</html>
